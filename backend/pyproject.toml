[project]
name = "milestone-escrow-backend"
version = "0.1.0"
description = "QA oracle and API for the QA-gated milestone escrow demo"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "ifcopenshell==0.9.0",
    "ifctester==0.9.0",
    "solana>=0.41",
    "solders>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["localnet: needs a running solana-test-validator with the program loaded (scripts/localnet.sh)"]
